      font-size: 20px;
      font-weight: 700;
      margin-bottom: 14px;

        const parsed = JSON.parse(savedCodes);
        allCodes = [...new Set([...defaultCodes, ...parsed])];
      } else {
        allCodes = defaultCodes;
      }
      localStorage.setItem('mcd_all_codes', JSON.stringify(allCodes));

      if (savedVisited) {
        visitedSet = new Set(JSON.parse(savedVisited));
      }

      render();
    }

    function saveState() {
      localStorage.setItem('mcd_all_codes', JSON.stringify(allCodes));
      localStorage.setItem('mcd_visited_codes', JSON.stringify([...visitedSet]));
    }

    function saveProtocol() {
      localStorage.setItem('mcd_proto', document.getElementById('protocolSelect').value);
    }

    function getUnvisitedCodes() {
      return allCodes.filter(c => !visitedSet.has(c));
    }

    function render() {
      const unvisited = getUnvisitedCodes();
      const total = allCodes.length;
      const doneCount = total - unvisited.length;

      document.getElementById('statsText').innerHTML =
        `總題庫: <b>${total}</b> 組 ｜ 已點過: <b>${doneCount}</b> ｜ 待領取: <b>${unvisited.length}</b>`;

      const btn = document.getElementById('giantBtn');
      const stepText = document.getElementById('stepText');
      const hintText = document.getElementById('hintText');
      const codeText = document.getElementById('codeText');

      if (unvisited.length === 0) {
        btn.className = 'done';
        stepText.textContent = '🎉 全部完成';
        hintText.textContent = `目前清單中的 ${total} 個網址皆已點過！`;
        codeText.textContent = '點擊右上角「➕ 貼上新連結」可隨時加入新網址';
      } else {
        const currentCode = unvisited[0];
        const currentOverallIdx = allCodes.indexOf(currentCode) + 1;
        btn.className = '';
        stepText.textContent = `剩餘 ${unvisited.length} 個`;
        hintText.textContent = '👆 點螢幕任意處 ➔ 跳轉 LINE 領取';
        codeText.textContent = `第 ${currentOverallIdx}/${total} 題 (q=${currentCode})`;
      }
    }

    function openNext() {
      const unvisited = getUnvisitedCodes();
      if (unvisited.length === 0) {
        openModal();
        return;
      }

      const code = unvisited[0];
      visitedSet.add(code);
      saveState();
      render();

      const proto = document.getElementById('protocolSelect').value;
      if (proto === 'line') {
        window.location.href = `line://app/${LIFF_ID}?q=${code}`;
      } else {
        window.location.href = `https://liff.line.me/${LIFF_ID}?q=${code}`;
      }
    }

    function stepPrev() {
      const visitedArray = [...visitedSet];
      if (visitedArray.length === 0) {
        showToast('已經是第 1 個囉！');
        return;
      }
      const lastCode = visitedArray[visitedArray.length - 1];
      visitedSet.delete(lastCode);
      saveState();
      render();
      showToast(`已退回上一題 (q=${lastCode})`);
    }

    function stepSkip() {
      const unvisited = getUnvisitedCodes();
      if (unvisited.length === 0) return;
      const code = unvisited[0];
      visitedSet.add(code);
      saveState();
      render();
      showToast(`已跳過 q=${code}`);
    }

    function openModal() {
      document.getElementById('rawInput').value = '';
      document.getElementById('modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
    }

    function importUrls(mode) {
      const raw = document.getElementById('rawInput').value;
      const extracted = extractCodes(raw);

      if (extracted.length === 0) {
        alert('找不到符合格式的 LIFF 網址（需包含 q=12碼序號）！');
        return;
      }

      if (mode === 'replace') {
        allCodes = extracted;
        visitedSet.clear();
        saveState();
        render();
        closeModal();
        showToast(`已替換為全新 ${extracted.length} 組網址！`);
      } else {
        const beforeCount = allCodes.length;
        const merged = [...new Set([...allCodes, ...extracted])];
        const newlyAdded = merged.length - beforeCount;
        allCodes = merged;
        saveState();
        render();
        closeModal();
        const unvisitedNow = getUnvisitedCodes().length;
        showToast(`成功解析 ${extracted.length} 組！新增 ${newlyAdded} 組未重複網址（待領取共 ${unvisitedNow} 組）`);
      }
    }

    function resetVisited() {
      if (confirm('確定要將目前所有網址重置為「未點過」，從頭開始刷嗎？')) {
        visitedSet.clear();
        saveState();
        render();
        showToast('已重置所有進度！');
      }
    }

    function restoreDefault() {
      if (confirm('確定要還原為預設清單並重置進度嗎？')) {
        allCodes = extractCodes(DEFAULT_TEXT);
        visitedSet.clear();
        saveState();
        render();
        closeModal();
        showToast('已還原預設清單！');
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2600);
    }

    init();
  </script>
</body>
</html>
